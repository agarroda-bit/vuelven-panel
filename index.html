<style>
:root{
  --bg:#f3f6f4; --surface:#ffffff; --surface-2:#e8efeb; --ink:#142226; --muted:#56696a; --line:#d4ded9;
  --green:#1d6b52; --green-ink:#ffffff; --green-soft:#d5ebe2; --amber:#9a6412; --amber-soft:#f6e3b4;
  --red:#b3261e; --red-soft:#f8dcd9; --blue:#2c5f8a; --blue-soft:#dbe8f3;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Onest","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1615; --surface:#15201e; --surface-2:#1b2927; --ink:#e6efeb; --muted:#9db0ab; --line:#2a3b38;
    --green:#58c29a; --green-ink:#07130f; --green-soft:#17372d; --amber:#e8b455; --amber-soft:#3a2c10;
    --red:#f07a6e; --red-soft:#3d1a17; --blue:#7fb2e0; --blue-soft:#172a3a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1615; --surface:#15201e; --surface-2:#1b2927; --ink:#e6efeb; --muted:#9db0ab; --line:#2a3b38;
  --green:#58c29a; --green-ink:#07130f; --green-soft:#17372d; --amber:#e8b455; --amber-soft:#3a2c10;
  --red:#f07a6e; --red-soft:#3d1a17; --blue:#7fb2e0; --blue-soft:#172a3a;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 60px;margin:0}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;color:var(--ink);text-wrap:balance}
h1{font-size:1.5rem;font-weight:800}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0;color:var(--ink)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
a{color:var(--green)}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:28px;height:28px;border-radius:8px;background:var(--green);display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:6px;flex:none}
.mark i{background:var(--green-ink);border-radius:2px}
.mark i:nth-child(2){opacity:.4}
.top .right{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.demo-bar{background:var(--amber-soft);color:var(--ink);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:.9rem}
.demo-bar b{color:var(--amber)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding-block:8px;margin-bottom:14px;border-bottom:1px solid var(--line)}
nav.tabs button{flex:none;border:0;background:transparent;color:var(--muted);font:600 .92rem var(--body);padding:8px 12px;border-radius:8px;cursor:pointer;position:relative}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
nav.tabs .n{display:inline-block;min-width:1.4em;margin-left:5px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font:600 .72rem var(--mono);line-height:1.5}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.stack{display:grid;gap:14px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
label{font-weight:600;font-size:.86rem;color:var(--ink);display:grid;gap:5px}
input,select,textarea{font:500 .95rem var(--body);padding:9px 11px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:84px;resize:vertical;line-height:1.45}
.hint{font-weight:400;font-size:.8rem;color:var(--muted)}
.btn{border:0;border-radius:9px;padding:9px 13px;font:600 .9rem var(--body);cursor:pointer;background:var(--surface-2);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.main{background:var(--green);color:var(--green-ink)}
.btn.warn{background:var(--red-soft);color:var(--red)}
.btn.sel{outline:2px solid var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav.tabs button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font:500 1.25rem var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;color:var(--muted)}
.kpi.good b{color:var(--green)}
.kpi.bad b{color:var(--red)}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;background:var(--surface)}
.item-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.item-top strong{font-size:1rem;color:var(--ink)}
.meta{font-size:.82rem;color:var(--muted);font-family:var(--mono)}
.msg{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:.9rem;color:var(--ink);white-space:pre-wrap}
.pill{font-size:.76rem;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.red{background:var(--red-soft);color:var(--red)}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;color:var(--ink)}
th{background:var(--surface-2);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.total td{font-weight:700;border-top:2px solid var(--ink)}
pre.report{white-space:pre-wrap;background:var(--surface-2);border-radius:10px;padding:12px;font:500 .85rem var(--mono);color:var(--ink);margin:0}
.empty{color:var(--muted);padding:6px 2px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:20;max-width:90vw}
.login{max-width:420px;margin:8vh auto 0;display:grid;gap:14px}
.confirm{background:var(--red-soft);border-radius:10px;padding:12px;display:grid;gap:10px;color:var(--ink)}
details.box{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.box summary{cursor:pointer;padding:12px 14px;font-weight:600;color:var(--ink)}
details.box .in{padding:0 14px 14px;display:grid;gap:10px}
@media (max-width:520px){h1{font-size:1.25rem}.card{padding:13px}}

<script>
/* Panel VUELVEN — capa de datos.
   Dos modos con las mismas funciones:
   - SupaDB: servidor real (Supabase), si existe window.PANEL_CONFIG con url y clave.
   - DemoDB: todo en este navegador, con datos inventados, para enseñar. */
(function(){
var TABLAS=["pacientes","presupuestos","resenas","llamadas","citas","espera","socios","reposiciones","cobros","recomendaciones","resultados"];
var DAY=86400000;
function uid(){return "x"+Math.random().toString(36).slice(2)+Date.now().toString(36)}
function hoyISO(off){var d=new Date(Date.now()-(off||0)*DAY);return d.toISOString().slice(0,10)}
function isoLocal(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function tsAgo(days,h){return new Date(Date.now()-days*DAY-(h||0)*3600000).toISOString()}

/* ---------------- Servidor real ---------------- */
function SupaDB(cfg){
  var sb=window.supabase.createClient(cfg.url,cfg.clave,{auth:{persistSession:true,autoRefreshToken:true}});
  function ok(r){if(r.error)throw new Error(traducir(r.error.message));return r.data}
  function traducir(m){
    if(/Invalid login/i.test(m))return "Correo o contraseña incorrectos.";
    if(/Email not confirmed/i.test(m))return "Falta confirmar el correo: mira tu bandeja de entrada.";
    if(/already registered/i.test(m))return "Ese correo ya tiene cuenta. Entra con tu contraseña.";
    if(/Password should be/i.test(m))return "La contraseña tiene que tener al menos 6 caracteres.";
    if(/Failed to fetch|NetworkError|Load failed/i.test(m))return "No hay conexión con el servidor. Mira tu internet y vuelve a probar.";
    return m;
  }
  return {
    demo:false,
    async usuario(){var r=await sb.auth.getUser();return r.data&&r.data.user?{id:r.data.user.id,email:r.data.user.email}:null},
    async entrar(email,pass){var r=await sb.auth.signInWithPassword({email:email,password:pass});ok(r);return {id:r.data.user.id,email:r.data.user.email}},
    async registrar(email,pass){var r=await sb.auth.signUp({email:email,password:pass,options:{emailRedirectTo:location.href.split("#")[0]}});ok(r);return r.data.session?{id:r.data.user.id,email:r.data.user.email}:null},
    async recordar(email){ok(await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href.split("#")[0]}))},
    async cambiarClave(pass){ok(await sb.auth.updateUser({password:pass}))},
    alCambiarSesion(fn){sb.auth.onAuthStateChange(function(ev){fn(ev)})},
    async salir(){await sb.auth.signOut()},
    async esAdmin(){var r=await sb.from("admins").select("user_id");return !r.error&&r.data.length>0},
    async clinicas(){return ok(await sb.from("clinicas").select("*").order("nombre"))},
    async crearClinica(c){return ok(await sb.from("clinicas").insert(c).select().single())},
    async editarClinica(id,p){return ok(await sb.from("clinicas").update(p).eq("id",id).select().single())},
    async unirse(codigo){return ok(await sb.rpc("unirse_a_clinica",{codigo:codigo}))},
    async todo(tabla,cid){
      var out=[],from=0,step=1000;
      while(true){var r=ok(await sb.from(tabla).select("*").eq("clinica_id",cid).range(from,from+step-1));out=out.concat(r);if(r.length<step)break;from+=step}
      return out;
    },
    async insertar(tabla,filas){var out=[];for(var i=0;i<filas.length;i+=500){out=out.concat(ok(await sb.from(tabla).insert(filas.slice(i,i+500)).select()))}return out},
    async fusionarPacientes(filas){var n=0;for(var i=0;i<filas.length;i+=500){var r=ok(await sb.from("pacientes").upsert(filas.slice(i,i+500),{onConflict:"clinica_id,telefono"}).select("id"));n+=r.length}return n},
    async editar(tabla,id,p){return ok(await sb.from(tabla).update(p).eq("id",id).select().single())},
    async borrar(tabla,id){ok(await sb.from(tabla).delete().eq("id",id))},
    async borrarTodo(tabla,cid){ok(await sb.from(tabla).delete().eq("clinica_id",cid))},
    async decision(cid,mes){var r=ok(await sb.from("decisiones").select("texto").eq("clinica_id",cid).eq("mes",mes));return r.length?r[0].texto:""},
    async guardarDecision(cid,mes,texto){ok(await sb.from("decisiones").upsert({clinica_id:cid,mes:mes,texto:texto},{onConflict:"clinica_id,mes"}))}
  };
}

function DemoDB(){
  var KEY="panel-vuelven-demo-v2",S=null;
  function guardar(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  function cargar(){try{var t=localStorage.getItem(KEY);if(t)return JSON.parse(t)}catch(e){}return null}
  function semilla(){
    var nombres=["Marta","Jordi","Laura","Sergio","Nuria","Carlos","Anna","Pablo","Lucía","Marc","Elena","David","Cristina","Javier","Sara","Albert","Paula","Raúl","Montse","Iván","Irene","Óscar","Silvia","Adrián","Rosa"];
    var apellidos=["Ruiz","Puig","Gómez","Martín","García","López","Vidal","Sánchez","Fernández","Soler","Torres","Romero","Navarro","Moreno","Castillo","Ferrer","Ortega","Díaz","Serra","Molina","Blanco","Rubio","Pons"];
    var seed=17;function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}
    function nombre(i){return nombres[i%nombres.length]+" "+apellidos[(i*7)%apellidos.length]}
    function tel(i){return "6000"+String(10000+i).slice(-5)}
    var c1={id:"demo-dental",nombre:"Clínica Dental Ejemplo",tipo:"den",firma:"Laura, de la clínica",ticket:70,enlace_resena:"https://g.page/r/ejemplo/review",meses_dormido:6,max_meses:60,lote:25,dias_oleada:5,plantillas:{},codigo_alta:"DEMO123456",activa:true,plan:"completo",modulos:{},ciclo_meses:6,telefono:"931234567"};
    var c2={id:"demo-vet",nombre:"Veterinaria Ejemplo",tipo:"vet",firma:"Marc, de la clínica",ticket:65,enlace_resena:"",meses_dormido:13,max_meses:36,lote:40,dias_oleada:5,plantillas:{},codigo_alta:"DEMO654321",activa:true,plan:"basico",modulos:{},ciclo_meses:12,telefono:""};
    var t={};TABLAS.forEach(function(n){t[n]=[]});
    var now=new Date();
